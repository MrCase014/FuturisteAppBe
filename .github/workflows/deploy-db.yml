name: Déployer le schéma sur Supabase

# Applique les migrations au projet Supabase réel.
#
# ⚠️ AUCUNE clé n'est écrite dans ce fichier ni dans le dépôt. Elles vivent
# dans les secrets GitHub, que seul le propriétaire du dépôt peut lire, et ne
# transitent jamais par une conversation (docs/12 §9).
#
# Secrets à créer dans Settings → Secrets and variables → Actions :
#   SUPABASE_ACCESS_TOKEN  — jeton personnel Supabase (Account → Access Tokens)
#   SUPABASE_PROJECT_REF   — la référence du projet, ex. eaibpxznqfqzcxsjvykg
#   SUPABASE_DB_PASSWORD   — mot de passe de la base, choisi à la création

on:
  workflow_dispatch:
    inputs:
      confirmer:
        description: 'Taper APPLIQUER pour confirmer'
        required: true
        default: ''
  push:
    branches: [main]
    paths: ['supabase/migrations/**']

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrations → Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Garde-fou sur le déclenchement manuel
        if: github.event_name == 'workflow_dispatch' && inputs.confirmer != 'APPLIQUER'
        run: |
          echo "::error::Confirmation manquante. Relancez en tapant APPLIQUER."
          exit 1

      - name: Vérifier que les secrets sont présents
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=""
          [ -z "$TOKEN" ]    && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$REF" ]      && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing — à créer dans Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Relier le projet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Aperçu des changements à appliquer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Appliquer les migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Contrôle — le schéma est bien en place
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Tables publiques du projet :"
          supabase db dump --schema public --data-only=false 2>/dev/null \
            | grep -c "^CREATE TABLE" || true
