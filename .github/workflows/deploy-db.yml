name: Déployer le schéma sur Supabase

# Applique les migrations à la base de PRODUCTION.
#
# ⚠️ AUCUNE clé n'est écrite ici ni dans le dépôt. Elles vivent dans les secrets
# GitHub, que seul le propriétaire peut écrire et que personne ne peut relire,
# et ne transitent jamais par une conversation (docs/12 §9).
#
# Secrets à créer dans Settings → Secrets and variables → Actions :
#   SUPABASE_ACCESS_TOKEN  — jeton personnel Supabase (Account → Access Tokens)
#   SUPABASE_PROJECT_REF   — référence du projet, ex. eaibpxznqfqzcxsjvykg
#   SUPABASE_DB_PASSWORD   — mot de passe de la base
#
# DÉCLENCHEMENT MANUEL UNIQUEMENT. Un déclenchement automatique sur `main`
# ferait migrer une base de production à chaque fusion — sans protection de
# branche, quiconque pousse sur main modifierait la base des familles. Une
# migration de production est une décision, pas un effet de bord.

on:
  workflow_dispatch:
    inputs:
      confirmer:
        description: 'Taper APPLIQUER pour confirmer'
        required: true
        default: ''

concurrency:
  group: deploy-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrations → Supabase
    runs-on: ubuntu-latest
    # Rattache le job à un environnement GitHub : c'est là que se règle une
    # approbation manuelle obligatoire (Settings → Environments → production
    # → Required reviewers). Fortement recommandé avant la vraie production.
    environment: production
    steps:
      - name: Garde-fou sur la confirmation
        if: inputs.confirmer != 'APPLIQUER'
        run: |
          echo "::error::Confirmation manquante. Relancez en tapant APPLIQUER."
          exit 1

      - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v5

      - name: Vérifier que les secrets sont présents
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=""
          [ -z "$TOKEN" ]    && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$REF" ]      && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing — à créer dans Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Action tierce : épinglée à un commit, jamais à une étiquette mobile.
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest

      - name: Relier le projet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Aperçu des changements à appliquer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Appliquer les migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
