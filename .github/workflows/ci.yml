name: CI

on:
  # Les branches de travail sont couvertes par l'événement pull_request :
  # déclencher aussi sur push ferait tourner deux fois le même travail.
  push:
    branches: [main]
  pull_request:

# Un nouveau push annule le contrôle en cours sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pas de champ "version" : action-setup lit packageManager du package.json.
      # Préciser les deux provoque une erreur de versions contradictoires.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier que theme.css est à jour avec les jetons
        run: |
          pnpm --filter @futuriste/ui tokens
          git diff --exit-code packages/ui/tokens/theme.css \
            || (echo "::error::theme.css n'est pas à jour. Lancez : pnpm --filter @futuriste/ui tokens" && exit 1)

      - name: Vérifier que le seed est à jour avec le référentiel
        run: |
          pnpm db:seed:generate
          git diff --exit-code supabase/seed \
            || (echo "::error::Le seed ne correspond plus à packages/core/data. Lancez : pnpm db:seed:generate" && exit 1)

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  database:
    name: Schéma · RLS · 12 tests de sécurité
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: futuriste
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      FUTURISTE_DB: futuriste
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Client PostgreSQL
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Appliquer le schéma et les données de démonstration
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/local/00_auth_shim.sql
          for f in supabase/migrations/*.sql; do
            echo "→ $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
          for f in supabase/seed/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: 🔒 Les 12 tests de sécurité
        run: bash supabase/tests/run-rls-tests.sh

      - name: Vérifier que les types TypeScript sont à jour
        run: |
          pnpm db:types
          git diff --exit-code packages/supabase/src/database.types.ts \
            || (echo "::error::database.types.ts n'est pas à jour. Lancez : pnpm db:types" && exit 1)
